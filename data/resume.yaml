  professional_experience:
    - title: 'Administrator, Assessment, Accountability, and Continuous Improvement'
      organization: 'Riverside County Office of Education'
      location: 'Riverside, CA'
      dates: 'Jul 2022 -- Present'
      body_tex: |-
        \begin{cvitems}
          \item {Facilitate the Data Subteam of the SoCal SOS Continuous Improvement: Data, Differentiated Assistance, and LCAP Workgroup, coordinating cross-COE data practice as part of RCOE's California System of Support Geographic Lead Agency responsibilities.}
          \item {Co-led the Statewide Data Visualization Community of Practice Network with the San Diego County Office of Education, building data visualization capacity across county offices statewide.}
          \item {Co-facilitated the Riverside County Assessment Network (RCAN) for several months during the transition following the prior assessment administrator's retirement, sustaining countywide assessment leader convening.}
          \item {Architected an on-premises countywide data system (RHEL 9, Kubernetes, Docker, Airflow, dbt, SQL Server, Minio, Tableau with row-level security) -- RCOE's first integrated data warehouse -- supporting the measurement of program impact on student achievement, district systems of support, and standardized reporting across the Educational Services Division.}
          \item {Led data operations across major countywide initiatives -- CalKIDS college savings (\$16M facilitated, 32,000+ students), CSU Direct Admissions Pilot (\$3M+ student financial impact, 19,000+ students), and the SBHIP Needs Assessment (\$7M+ in mental health grants to participating districts) -- negotiating data sharing agreements with the State Treasurer's Office and CSU Chancellor's Office, designing integration pipelines, and delivering Tableau dashboards with school-level permissioning.}
          \item {Provided direct data and evaluation support across the Superintendent's Initiatives, including coordination between Managed Care Plans and districts (SBHIP), suicide prevention (SPARE), socioemotional learning (CalHOPE), and Whole Health Screening (MHSSA).}
          \item {Established a cross-divisional Student Data PLC at RCOE spanning Educational Services, Student Programs and Services, Early Education Services, Leadership, Wellness, and Student Services, addressing technical and programmatic data system needs across the organization.}
          \item {Maintain RCOE's Data Asset Catalog and serve as cross-divisional consultant on student data sharing -- advising the Chief Strategic Communications Office, the Career Technical Education unit, and other divisions on FERPA compliance, statutory requirements, and DSA structure for new initiatives -- building on the data governance framework first established as Data Coordinator.}
          \item {Supported program evaluations across the Educational Services Division -- including the Bourns Science and Technology Education Partnership (STEP) conference survey and analysis and the Migrant Education program evaluation -- in addition to ongoing research request fulfillment.}
          \item {Member of the RCOE LCAP Fastpass team, contributing review on compliance in annual district LCAP submissions to inform the Superintendent's plan approvals across Riverside County's 23 districts.}
          \item {Mentored three interns in educational data analysis and visualization -- one of whom secured a data visualization position on completion of the placement; cross-trained peer administrators, coordinators, and contractors in evaluation, survey design, and research request workflows, contributing to a 48\% increase in unit project volume (101 projects in 2025--26 vs. 68 prior year); serve as evaluator of record for the AACI unit's administrative support position.}
          \item {Named 2024 Classified Administrator of the Year, Riverside County Office of Education.}
        \end{cvitems}

    - title: 'Data Coordinator'
      organization: 'Riverside County Office of Education'
      location: 'Riverside, CA'
      dates: 'Apr 2018 -- Jun 2022'
      body_tex: |-
        \begin{cvitems}
          \item {Built a regression-based "Positive Outlier" model spanning all 23 Riverside County districts and 500+ schools, controlling for student demographics across ELA, Math, and NGSS to identify schools outperforming expectations -- used by the Instructional Services Unit to identify and share effective practices across similar-demographic schools.}
          \item {Built a countywide linked analytic dataset integrating CALPADS, CAASPP, ELPAC, and College Board records for 430,000+ students in partnership with UC Riverside, enabling the Haynes Foundation research project "Examining Disparities in Mathematics Achievement to Promote Equity."}
          \item {Contributed to annual LCAP review and approval for 23 districts, focusing on metric rigor and Increased/Improved Services compliance for unduplicated pupils, and delivered recurring training to district LCAP authors on outcome monitoring and accountability alignment.}
          \item {Initiated RCOE's first formal data governance framework, producing a policies-and-procedures manual and data inventory that standardized privacy and quality practices and became part of Educational Services Division onboarding.}
          \item {Facilitated cross-county data practice workgroups spanning five County Offices of Education (Imperial, Orange, Riverside, San Bernardino, San Diego), creating a regional venue for sharing data tools, iterating on shared resources, and building capacity in COVID-era data analysis and CSI/ATSI identification.}
        \end{cvitems}

    - title: 'Curriculum and Instruction Coordinator'
      organization: 'Menifee Union School District'
      location: 'Menifee, CA'
      dates: 'Jun 2016 -- Apr 2018'
      body_tex: |-
        \begin{cvitems}
          \item {Coauthored the district LCAP and led implementation monitoring, aligning metrics and Increased/Improved Services requirements to measurable student outcomes across all district actions.}
          \item {Validated district benchmark cut points against Smarter Balanced CAASPP outcomes using regression analysis -- psychometric validation ensuring local interim assessment performance levels accurately predicted state results across 13 sites.}
          \item {Managed the district's balanced assessment system across 10 elementary and 3 middle school sites, integrating Common Core-aligned formative and interim local benchmarks with the statewide portfolio (ELPAC, CAASPP, GATE, NAEP, PSAT 8/9, PFT).}
        \end{cvitems}

    - title: 'TOSA - Compliance Coordinator'
      organization: 'Riverside Unified School District'
      location: 'Riverside, CA'
      dates: 'Aug 2013 -- Jun 2016'
      body_tex: |-
        \begin{cvitems}
          \item {Led the district's Federal Program Monitoring reviews across two cycles (online and in-person), mitigating over \$500,000 in potential compliance findings through corrective action and stakeholder engagement.}
          \item {Advised leadership on allocation of \$10M+ in Title I funds, ensuring fiscal compliance while aligning spending to instructional priorities.}
          \item {Identified and resolved a systemic course-placement error in AERIES SIS affecting 1,000+ Academic English Learners, then developed and delivered corrective professional development for administrators and counselors.}
        \end{cvitems}

    - title: 'Director of Bands, Ramona High School'
      organization: 'Riverside Unified School District'
      location: 'Riverside, CA'
      dates: 'Aug 2009 -- Jun 2013'
      body_tex: |-
        \begin{cvitems}
          \item {Recruited, supervised, and evaluated walk-on coaching staff while managing an annual program budget exceeding \$100,000 for an instrumental music program serving 100+ students across marching, concert, and jazz ensembles (SCSBOA 2A Championships bronze).}
          \item {Built community and booster partnerships sustaining program funding and student participation across enrollment cycles, engaging parents, alumni, and local stakeholders at the school-community interface.}
        \end{cvitems}

