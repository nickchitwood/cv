  professional_experience:
    # Current role — REORDERED for AACI ED positioning. Lead with
    # accountability / Continuous Improvement / LCAP / statewide leadership,
    # then technical scope, then major-program impact summarized into one
    # bullet so the dollar figures are visible without the per-program detail.
    - title: 'Administrator, Assessment, Accountability, and Continuous Improvement'
      organization: 'Riverside County Office of Education'
      location: 'Riverside, CA'
      dates: 'Jul 2022 -- Present'
      body_tex: |-
        \begin{cvitems}
          \item {Member of the RCOE LCAP Fastpass team, contributing compliance review on annual district LCAP submissions to inform the Superintendent's plan approvals across Riverside County's 23 districts.}
          \item {Facilitate the Data Subteam of the SoCal SOS Continuous Improvement: Data, Differentiated Assistance, and LCAP Workgroup, coordinating cross-COE data practice in support of data literacy across the California System of Support.}
          \item {Co-led the Statewide Data Visualization COE Network with the San Diego County Office of Education, and co-facilitated the Riverside County Assessment Network (RCAN) through the transition following the prior assessment administrator's retirement.}
          \item {Architected an on-premises countywide data system (RHEL 9, Kubernetes, Docker, Airflow, dbt, SQL Server, Minio, Tableau with row-level security) -- RCOE's first integrated data warehouse -- supporting the measurement of program impact on student achievement, district systems of support, and standardized reporting across the Educational Services Division.}
          \item {Established a cross-divisional Student Data PLC at RCOE spanning Educational Services, Student Programs and Services, Early Education Services, Leadership, Wellness, and Student Services; supported program evaluations including the Bourns Science and Technology Education Partnership (STEP) conference and the Migrant Education program evaluation.}
          \item {Built and managed countywide data systems for major partnership programs: CalKIDS (23 districts, 32,000+ students registered, access to \$16,000,000 in college savings); CSU Direct Admissions Pilot (every Riverside County high school, 19,000+ students, nearly \$3,000,000 in direct student financial impact); SBHIP Needs Assessment ($\$$7,000,000 in mental health grants awarded to participating districts). Led DSA negotiations with the State Treasurer's Office and CSU system.}
          \item {Named 2024 Classified Administrator of the Year, Riverside County Office of Education.}
        \end{cvitems}

    - title: 'Data Coordinator'
      organization: 'Riverside County Office of Education'
      location: 'Riverside, CA'
      dates: 'Apr 2018 -- Jun 2022'
      body_tex: |-
        \begin{cvitems}
          \item {Contributed to annual LCAP review and approval for 23 districts, focusing on metric rigor and Increased/Improved Services compliance for unduplicated pupils; delivered recurring training to district LCAP authors on outcome monitoring and accountability alignment.}
          \item {Initiated RCOE's first formal data governance framework -- producing a policies-and-procedures manual and data inventory that standardized privacy and quality practices and became part of Educational Services Division onboarding.}
          \item {Facilitated cross-county data practice workgroups spanning five County Offices of Education (Imperial, Orange, Riverside, San Bernardino, San Diego) for shared CSI/ATSI identification, COVID-era analysis, and regional data tooling.}
        \end{cvitems}

    - title: 'Curriculum and Instruction Coordinator'
      organization: 'Menifee Union School District'
      location: 'Menifee, CA'
      dates: 'Jun 2016 -- Apr 2018'
      body_tex: |-
        \begin{cvitems}
          \item {Authored the district LCAP and led implementation monitoring -- aligning metrics and Increased/Improved Services requirements to measurable student outcomes across all district actions.}
          \item {Managed the district's full assessment portfolio (ELPAC, CAASPP, GATE, NAEP, PSAT 8/9, PFT, and local benchmarks) across 10 elementary and 3 middle school sites; validated district benchmark cut points against CAASPP outcomes via regression analysis.}
        \end{cvitems}

    - title: 'TOSA -- Compliance Coordinator'
      organization: 'Riverside Unified School District'
      location: 'Riverside, CA'
      dates: 'Aug 2013 -- Jun 2016'
      body_tex: ''

    - title: 'Music Educator'
      organization: 'Riverside USD (Ramona HS); Victor ESD; Los Banos USD'
      location: 'CA'
      dates: 'Aug 2006 -- Jun 2013'
      body_tex: ''

